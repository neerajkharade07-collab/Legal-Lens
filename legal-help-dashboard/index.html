<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Legal Help — LegalLens</title>
    <!-- Standalone preview page. Serve it over http (e.g. VS Code Live Server) —
         browsers block API calls from file:// pages. -->
    <link rel="stylesheet" href="legal-help.css" />
    <style>
      html, body { margin: 0; background: #ffffff; }
    </style>
  </head>
  <body>
    <div id="legal-help"></div>

    <!-- Shared site config: API_BASE_URL is "/api" when deployed (same origin,
         proxied to the backend by Vercel) and http://localhost:5000/api only
         for local static development. -->
    <script src="../config.js"></script>
    <script src="legal-help-data.js"></script>
    <script src="legal-help-service.js"></script>
    <script src="legal-help-components.js"></script>
    <script src="legal-help.js"></script>
    <script>
      LegalHelpDashboard.mount(document.getElementById('legal-help'), {
        // Legal Lens backend (from ../config.js). The OpenAI key stays in the backend .env.
        // Previously hard-coded to http://localhost:5000/api, which fails on the public site.
        apiBaseUrl: typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : '/api'
      });
    </script>
  </body>
</html>
